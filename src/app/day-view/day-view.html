<ul>
  @for (chore of chores(); track chore) {
    <li>
      <button
        type="button"
        [class]="'chore ' + chore.color"
        [class.done]="store.isDone(chore, day())"
        [attr.aria-pressed]="store.isDone(chore, day())"
        (click)="store.tickOff(chore, day())"
      >
        {{ chore.name }}
      </button>
    </li>
  } @empty {
    <li class="empty">An diesem Tag ist nichts fällig.</li>
  }
</ul>

@if (weekChores().length) {
  <app-anytime-strip label="Irgendwann diese Woche" [start]="weekStart()" [items]="weekChores()" />
}
@if (monthChores().length) {
  <app-anytime-strip
    label="Irgendwann diesen Monat"
    [start]="monthStart()"
    [items]="monthChores()"
  />
}
