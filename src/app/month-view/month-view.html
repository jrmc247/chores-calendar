<div class="grid">
  @for (weekday of weekdays; track weekday) {
    <div class="weekday">{{ weekday }}</div>
  }

  @for (day of days(); track day.date.getTime()) {
    <div class="day" [class.outside]="!day.isInMonth" [class.today]="day.isToday">
      <span class="number">{{ day.date.getDate() }}</span>
      @for (chore of day.chores; track chore) {
        <button
          type="button"
          [class]="'chore ' + chore.color"
          [class.done]="store.isDone(chore, day.date)"
          [attr.aria-pressed]="store.isDone(chore, day.date)"
          (click)="store.toggleDone(chore, day.date)"
        >
          {{ chore.name }}
        </button>
      }
    </div>
  }
</div>
